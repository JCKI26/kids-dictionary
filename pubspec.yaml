name: kids_dict_app
description: A simple English dictionary app for kids (10 and under).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pinyin: ^3.3.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.3
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary.json
    - assets/alternatives.json
    - assets/images/
